<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 96" width="128" height="96" role="img" aria-label="Transfer Efecty">
  <defs>
    <linearGradient id="teWallet" x1="30" y1="16" x2="118" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1D4ED8"/>
      <stop offset="0.55" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="teFlap" x1="34" y1="10" x2="104" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1E40AF"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="teArrow" x1="46" y1="48" x2="96" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="teSpeed" x1="0" y1="48" x2="46" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
  </defs>

  <!-- Líneas de velocidad -->
  <g fill="url(#teSpeed)">
    <rect x="2"  y="34" width="16" height="7" rx="3.5"/>
    <rect x="14" y="45" width="26" height="7" rx="3.5"/>
    <rect x="6"  y="56" width="18" height="7" rx="3.5"/>
    <rect x="24" y="23" width="14" height="7" rx="3.5"/>
    <rect x="20" y="67" width="12" height="7" rx="3.5"/>
  </g>

  <!-- Solapa superior de la billetera -->
  <path d="M40 22.5 L96 8.5 a5 5 0 0 1 6.2 4.2 L104 26 H40 Z" fill="url(#teFlap)"/>

  <!-- Cuerpo de la billetera -->
  <rect x="36" y="24" width="76" height="60" rx="12" fill="url(#teWallet)"/>

  <!-- Flecha entrando -->
  <path d="M46 51.5 h30 l-9.5 -9.5 5.5 -5.5 L91 51.5 71.5 71 66 65.5 75.5 56 H46 Z" fill="url(#teArrow)"/>

  <!-- Broche lateral -->
  <rect x="86" y="42" width="34" height="24" rx="10" fill="#1E3A8A"/>
  <circle cx="99" cy="54" r="6" fill="#F1F5F9"/>
</svg>
